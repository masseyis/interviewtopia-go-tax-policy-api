openapi: 3.0.3
info:
  title: Interviewtopia Household Tax Policy API for Go Assessment
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/license/mit
  description: |
    Returns the tax bands applicable to a household size.

    The calculator remains non-cumulative: the selected band's rate applies to
    the entire income. Final tax is rounded half up to the nearest cent. These
    rules are fixed from the base exercise; only the bands vary by household size.
servers:
  - url: https://masseyis.github.io/interviewtopia-go-tax-policy-api
security: []
paths:
  /policies/{residents}.json:
    get:
      summary: Get the policy bands for a household size
      operationId: getHouseholdTaxPolicy
      description: |
        Returns one complete set of inclusive, non-overlapping tax bands. Band
        order is not guaranteed. Clients should validate and normalise a policy
        before using it. The six-resident fixture contains 1,000 bands.
      parameters:
        - name: residents
          in: path
          required: true
          description: Number of people in the household.
          schema:
            type: integer
            minimum: 1
            maximum: 6
          example: 2
      responses:
        "200":
          description: Policy bands for the requested household size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdTaxPolicy"
        "404":
          description: No static fixture exists for the requested household size.
          content:
            text/html:
              schema:
                type: string
components:
  schemas:
    HouseholdTaxPolicy:
      type: object
      additionalProperties: false
      required: [policyId, residents, currency, bands]
      properties:
        policyId:
          type: string
          description: Opaque identifier for this version of the policy.
        residents:
          type: integer
          minimum: 1
          maximum: 6
        currency:
          type: string
          enum: [USD]
        bands:
          type: array
          minItems: 1
          maxItems: 1000
          description: Complete set of inclusive, non-overlapping bands. Order is not guaranteed.
          items:
            $ref: "#/components/schemas/TaxBand"
    TaxBand:
      type: object
      additionalProperties: false
      required: [minimumIncomeCents, maximumIncomeCents, rateBasisPoints]
      properties:
        minimumIncomeCents:
          type: integer
          format: int64
          minimum: 0
          description: Inclusive lower income bound in integer cents.
        maximumIncomeCents:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Inclusive upper income bound in integer cents, or null for no upper bound.
        rateBasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
          description: Tax rate in whole basis points; 1000 means 10 percent.

