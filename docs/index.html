<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Interviewtopia Policy API</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.32.14/swagger-ui.css" />
    <style>body { margin: 0; background: #fafafa; }</style>
  </head>
  <body>
    <noscript><p>JavaScript is required for Swagger UI. Read the <a href="../openapi.yaml">OpenAPI definition</a>.</p></noscript>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5.32.14/swagger-ui-bundle.js"></script>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        SwaggerUIBundle({
          url: '../openapi.yaml',
          dom_id: '#swagger-ui',
          deepLinking: true,
          displayRequestDuration: true,
          tryItOutEnabled: true,
          validatorUrl: null,
        })
      })
    </script>
  </body>
</html>
